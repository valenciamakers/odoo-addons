<!-- Our composition, derived from lucide-static v1.47.0 (ISC): layout-arrow-down, mirrored so the
     arrow is on the left, with its lower tile replaced by Lucide's layout-grid, for the app grid.
     The arrow and the top tile are shared by the three sort modules; the lower item says what each
     one sorts. It is drawn at 1.25px, the badge weight, since at this size 2px fills its shapes in. -->
