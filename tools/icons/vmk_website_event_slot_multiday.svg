<!-- Our composition, derived from lucide-static v1.47.0 (ISC): calendar-range at 0.9 scale, its
     stroke widened so it still draws at 2px, with a small globe badge (circle, meridian, equator)
     cut out of its bottom-right corner. The badge is drawn at 1.5px rather than Lucide's 2px: at
     this size a 2px globe fills in to a disc. The knockout circle is drawn in white, which
     tools/make_icon.py paints as transparency. -->
