<!-- Our composition, derived from lucide-static v1.47.0 (ISC): the plain calendar at 0.9 scale,
     its stroke widened so it still draws at 2px, with alarm-clock as a badge cut out of its
     bottom-right corner by the clock's own outline: face filled, bells and feet stroked wide. The
     badge is drawn at 1.5px rather than Lucide's 2px, as the website module's globe is. White is
     painted as transparency by tools/make_icon.py. -->
