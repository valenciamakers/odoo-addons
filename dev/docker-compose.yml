# Local Odoo 19 for developing and testing the modules in this repo.
# Run from this directory. See ../CLAUDE.md for the workflow and its gotchas.
#
# The repo root is mounted read-only as an addons path, so every module here is
# available to install by name. Nothing is written back to your working copy.

services:
  db:
    image: postgres:17 # matches production
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 3s
      timeout: 3s
      retries: 20

  odoo:
    image: odoo:19
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    volumes:
      - "../:/mnt/extra-addons:ro"
      # The filestore has to outlive the container. Every `docker compose run
      # --rm` gets a fresh one otherwise, while the database in the `db` service
      # persists -- so attachment rows survive pointing at files that went away
      # with the container, and app icons come back missing.
      - "odoo-filestore:/var/lib/odoo"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo

volumes:
  odoo-filestore:
